[workspace]
resolver = "3"
members = [
    "crates/ide-app",
    "crates/ide-application",
    "crates/ide-core",
    "crates/ide-debug-api",
    "crates/ide-domain",
    "crates/ide-language-api",
    "crates/ide-language-host",
    "crates/ide-project",
    "crates/language-java",
    "crates/java-classfile",
    "crates/java-toolchain",
    "crates/java-maven-adapter",
    "crates/java-gradle-adapter",
    "crates/java-debug-adapter",
    "crates/ide-process",
    "crates/ide-terminal",
    "crates/ide-toolchain-api",
    "crates/ide-ui",
    "crates/ide-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.24"
tree-sitter-java = "0.23.5"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
pollster = "0.4"
portable-pty = "=0.8.1"
rfd = "0.17.2"
winit = "0.30.13"
ui-api = { version = "0.1.0", path = "../ERLibUi/crates/ui-api" }
ui-clipboard-arboard = { version = "0.1.0", path = "../ERLibUi/crates/ui-clipboard-arboard" }
ui-components = { version = "0.1.0", path = "../ERLibUi/crates/ui-components" }
ui-core = { version = "0.1.0", path = "../ERLibUi/crates/ui-core" }
ui-editor = { version = "0.1.0", path = "../ERLibUi/crates/ui-editor" }
ui-render-api = { version = "0.1.0", path = "../ERLibUi/crates/ui-render-api" }
ui-render-wgpu = { version = "0.1.0", path = "../ERLibUi/crates/ui-render-wgpu" }
ui-text-cosmic = { version = "0.1.0", path = "../ERLibUi/crates/ui-text-cosmic" }
ui-window-api = { version = "0.1.0", path = "../ERLibUi/crates/ui-window-api" }
ui-window-winit = { version = "0.1.0", path = "../ERLibUi/crates/ui-window-winit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
