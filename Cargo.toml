[workspace]
resolver = "3"
members = [
    "crates/ide-app",
    "crates/ide-application",
    "crates/ide-core",
    "crates/ide-debug-api",
    "crates/ide-domain",
    "crates/ide-git",
    "crates/ide-language-api",
    "crates/ide-language-host",
    "crates/ide-project",
    "crates/language-angular",
    "crates/language-markup",
    "crates/language-java",
    "crates/language-style",
    "crates/language-typescript",
    "crates/ide-process",
    "crates/ide-terminal",
    "crates/ide-watch",
    "crates/ide-toolchain-api",
    "crates/ide-ui",
    "crates/ide-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
bitflags = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.24"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23.2"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
pollster = "0.4"
portable-pty = "=0.8.1"
justerm-core = "0.12"
rfd = "0.17.2"
winit = "0.30.13"
ui-api = { version = "0.1.0", path = "../ERLibUi/crates/ui-api" }
ui-clipboard-arboard = { version = "0.1.0", path = "../ERLibUi/crates/ui-clipboard-arboard" }
ui-components = { version = "0.1.0", path = "../ERLibUi/crates/ui-components" }
ui-core = { version = "0.1.0", path = "../ERLibUi/crates/ui-core" }
ui-editor = { version = "0.1.0", path = "../ERLibUi/crates/ui-editor" }
ui-focus = { version = "0.1.0", path = "../ERLibUi/crates/ui-focus" }
ui-host = { version = "0.1.0", path = "../ERLibUi/crates/ui-host" }
ui-commands = { version = "0.1.0", path = "../ERLibUi/crates/ui-commands" }
ui-layout-api = { version = "0.1.0", path = "../ERLibUi/crates/ui-layout-api" }
ui-layout-taffy = { version = "0.1.0", path = "../ERLibUi/crates/ui-layout-taffy" }
ui-render-api = { version = "0.1.0", path = "../ERLibUi/crates/ui-render-api" }
ui-render-wgpu = { version = "0.1.0", path = "../ERLibUi/crates/ui-render-wgpu" }
ui-text-cosmic = { version = "0.1.0", path = "../ERLibUi/crates/ui-text-cosmic" }
ui-window-api = { version = "0.1.0", path = "../ERLibUi/crates/ui-window-api" }
ui-window-winit = { version = "0.1.0", path = "../ERLibUi/crates/ui-window-winit" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
