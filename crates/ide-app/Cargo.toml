[package]
name = "ide-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Binário de entrega: a janela sobe sem o console atrás dela.
#
# É uma feature, e não um perfil, porque perfil do Cargo não chega ao código —
# não existe `cfg(profile = "release")`. Amarrá-la a `debug_assertions` faria o
# console sumir de **todo** release, e é justamente num release que se precisa do
# log quando algo só acontece lá.
#
# Desligada por padrão: quem compila para trabalhar quer ver o `tracing`.
producao = []

[dependencies]
async-trait.workspace = true
ide-application = { path = "../ide-application" }
ide-core = { path = "../ide-core" }
ide-debug-api = { path = "../ide-debug-api" }
ide-project = { path = "../ide-project" }
ide-domain = { path = "../ide-domain" }
ide-language-api = { path = "../ide-language-api" }
ide-language-host = { path = "../ide-language-host" }
ide-toolchain-api = { path = "../ide-toolchain-api" }
language-angular = { path = "../language-angular" }
language-java = { path = "../language-java" }
language-markup = { path = "../language-markup" }
language-style = { path = "../language-style" }
language-typescript = { path = "../language-typescript" }
ide-process = { path = "../ide-process" }
ide-terminal = { path = "../ide-terminal" }
ide-ui = { path = "../ide-ui" }
ide-workspace = { path = "../ide-workspace" }
pollster.workspace = true
rfd.workspace = true
tracing.workspace = true
tokio.workspace = true
